---
argument_specs:
  main:
    short_description: Install and configure MicroK8s on Debian 13.
    options:
      microk8s_channel:
        type: str
        default: 1.36/stable
        description: Pinned snap channel used for a new MicroK8s installation.
      microk8s_addons:
        type: list
        elements: str
        description: MicroK8s add-ons to enable.
      microk8s_snap_data_device:
        type: str
        required: true
        description: Block device dedicated to MicroK8s data; formatted as ext4 when it has no filesystem.
      microk8s_snap_data_path:
        type: str
        default: /mnt/microk8s
        description: Mount point for the MicroK8s data device.
      microk8s_users:
        type: list
        elements: str
        default: []
        description: Existing users that receive group membership and kubeconfig access.
      microk8s_create_command_aliases:
        type: bool
        default: true
        description: Whether to create the kubectl and helm snap aliases.
      microk8s_ready_timeout:
        type: int
        default: 600
        description: Seconds to wait for MicroK8s readiness.
